name: Sync meetings from Google Sheet

on:
  schedule:
    - cron: "0 16 * * *" # 00:00 HKT
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-meetings
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull Google Sheet
        run: python3 sync_meetings.py
      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meetings.js
          if git diff --staged --quiet; then
            echo "No meeting changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Sync meetings from Google Sheet"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
