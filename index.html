      --card: #ffffff;
      --teal: #0f4c5c;
      --teal-2: #16697a;
      --gold: #c4a35a;
      --coral: #c2410c;
      --chip: #eef6f7;
      --ok: #166534;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "PingFang TC", "Noto Sans TC", "Hiragino Sans CNS", "Heiti TC", sans-serif;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.55;
    }
    header.app {
      position: sticky; top: 0; z-index: 20;
      background: var(--teal);
      color: #fff;
      padding: 16px 20px 14px;
      box-shadow: 0 8px 24px rgba(15, 76, 92, .22);
    }
    header.app h1 {
      margin: 0 0 4px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: .04em;
    }
    header.app p { margin: 0 0 12px; opacity: .85; font-size: 13px; }
    .search-wrap { position: relative; max-width: 860px; }
    .search-wrap input {
      width: 100%;
      font-size: 18px;
      padding: 12px 16px 12px 44px;
      border: 0;
      border-radius: 12px;
      outline: none;
      box-shadow: 0 4px 16px rgba(0,0,0,.12);
    }
    .search-ico {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      opacity: .45; font-size: 16px; pointer-events: none;
    }
    nav.tabs {
      display: flex; gap: 6px; flex-wrap: wrap;
      padding: 12px 20px 0;
      background: var(--paper);
      position: sticky; top: 126px; z-index: 10;
    }
    @media (max-width: 640px) {
      nav.tabs { top: 148px; }
      header.app h1 { font-size: 17px; }
    }
    nav.tabs button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--teal);
      padding: 7px 12px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
    }
    nav.tabs button.active {
      background: var(--teal);
      color: #fff;
      border-color: var(--teal);
    }
    main { padding: 16px 20px 64px; max-width: 1100px; }
    .hint {
      color: var(--muted); font-size: 14px; margin: 8px 0 16px;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 18px; max-width: 100%; }
    @media (max-width: 640px) {
      .chip, .tchip { font-size: 13px; padding: 6px 9px; }
      .search-wrap input { font-size: 16px; } /* avoid iOS zoom */
    }
    .chip, .tchip {
      border: 1px solid var(--line);
      background: var(--chip);
      color: var(--teal);
      padding: 6px 10px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 13px;
    }
    .tchip { background: #fff; }
    .tchip b { color: var(--coral); margin-right: 4px; }
    .tchip.active, .chip.active { background: var(--teal); color: #fff; border-color: var(--teal); }
    .tchip.active b { color: #fde68a; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
      box-shadow: 0 2px 8px rgba(28,25,23,.04);
    }
    .card h2, .card h3 { margin: 0 0 8px; }
    .card h2 { font-size: 18px; color: var(--teal); }
    .card h3 { font-size: 15px; color: var(--teal-2); margin-top: 14px; }
    .meta { color: var(--muted); font-size: 13px; }
    .kv { display: grid; grid-template-columns: 88px 1fr; gap: 4px 10px; font-size: 14px; }
    .kv dt { color: var(--muted); }
    .kv dd { margin: 0; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      background: #fff;
    }
    th, td {
      border: 1px solid var(--line);
      padding: 7px 8px;
      text-align: left;
      vertical-align: top;
    }
    th { background: #f0f7f8; color: var(--teal); font-weight: 600; white-space: nowrap; }
    .table-wrap { overflow-x: auto; margin: 8px 0 16px; border-radius: 10px; }
    .empty { padding: 40px 10px; text-align: center; color: var(--muted); }
    .badge {
      display: inline-block;
      background: #fde7d8;
      color: var(--coral);
      border-radius: 6px;
      padding: 1px 6px;
      font-size: 12px;
      margin-left: 4px;
    }
    .badge.teal { background: #d9eef2; color: var(--teal); }
    .badge.gold { background: #f4ead0; color: #7a5b12; }
    .duty-item {
      padding: 8px 0;
      border-bottom: 1px dashed var(--line);
      font-size: 14px;
    }
    .duty-item:last-child { border-bottom: 0; }
    .hl { background: #fff3bf; padding: 0 2px; border-radius: 3px; }
    .welcome { max-width: 860px; }
    .stat {
      display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0 18px;
    }
    .stat span {
      background: #fff; border: 1px solid var(--line); border-radius: 10px;
      padding: 10px 14px; font-size: 13px;
    }
    .stat b { display: block; font-size: 20px; color: var(--teal); }
    footer {
      color: var(--muted); font-size: 12px; padding: 8px 20px 24px;
    }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 800px) { .row-2 { grid-template-columns: 1fr; } }
    .name-line { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .name-line .code {
      font-size: 28px; color: var(--coral); font-weight: 800; line-height: 1;
    }
    a.linkish { color: var(--teal-2); cursor: pointer; text-decoration: underline; }
  </style>
</head>

      "星期二": "行政會 (清/呂/恒/談/穩/偉/幗/仁/穎/蔚)",
      "星期三": "",
      "星期四": "P4科學科(燕/恒/智) (校外支援會議)"
    },
    {
      "星期一": "",
      "星期二": "",
      "星期三": "",
      "星期四": "P5人文科(何瑤談仁)(杰) (校外支援會議)"
    }
  ],
  "subjectAliases": {
    "中文": [
      "中",
      "中文",
      "中文科"
    ],
    "英文": [
      "英",
      "英文",
      "英文科",
      "英語"
    ],
    "數學": [
      "數",
      "數學",
      "數學科"
    ],
    "常識": [
      "常",
      "常識",
      "常識科"
    ],
    "人文": [
      "人",
      "人文",
      "人文科"
    ],
    "科學": [
      "科",
      "科學",
      "科學科"
    ],
    "音樂": [
      "音",
      "音樂",
      "音樂科"
    ],
    "體育": [
      "體",
      "體育",
      "體育科"
    ],
    "視藝": [
      "視",
      "視藝",
      "視藝科",
      "美術"
    ],
    "普通話": [
      "普",
      "普通話",
      "普通話科"
    ],
    "資訊科技": [
      "資",
      "資訊",
      "資訊科技",
      "資訊科技科",
      "電腦"
    ],
    "生命教育": [
      "生",
      "生命",
      "生命教育"
    ]
  }
};

</script>
  <script>
    const TABS = [
      ["home", "總覽"],
      ["teacher", "老師"],
      ["klass", "班別"],
      ["subject", "科目"],
      ["timetable", "時間表"],
      ["duty", "當值"],
      ["pm", "下午活動"],
      ["prep", "備課"],
      ["rules", "守則"]
    ];
    const state = { tab: "home", q: "", teacher: null, klass: null, subject: null };

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    const PM_LABEL = { mon: "一", tue: "二", wed: "三", thu: "四", fri: "五" };
    const SUBJ_FULL = {中:"中文",英:"英文",數:"數學",常:"常識",科學:"科學",人文:"人文",音:"音樂",體:"體育",視:"視藝",普:"普通話",資:"資訊科技"};
    function fullSubject(s) { return SUBJ_FULL[s] || s; }
    const DAYS6 = ["DAY 1","DAY 2","DAY 3","DAY 4","DAY 5","DAY 6"];
    const WEEKDAYS = ["星期一","星期二","星期三","星期四","星期五"];
    const PERIOD_RANK = {一:1,二:2,三:3,四:4,五:5,六:6,七:7};
    function dayRank(day) {
      const d6 = DAYS6.indexOf(day);
      if (d6 >= 0) return d6;
      const w = WEEKDAYS.indexOf(day);
      if (w >= 0) return 10 + w;
      return 99;
    }
    function periodRank(period) {
      const m = String(period || "").match(/第([一二三四五六七])/);
      return m ? PERIOD_RANK[m[1]] : 99;
    }
    function sortDutyList(list) {
      return [...(list || [])].sort((a, b) =>
        dayRank(a.day) - dayRank(b.day) || periodRank(a.period) - periodRank(b.period)
      );
    }

    function teacherByCode(code) {
      return DATA.teachers.find(t => t.code === code);
    }
    function teacherLabel(code) {
      const t = teacherByCode(code);
      if (!t) return esc(code);
      return `<a class="linkish" data-go-teacher="${esc(t.code)}">${esc(t.code)} ${esc(t.name)}</a>`;
    }

    function renderTabs() {
      $("tabs").innerHTML = TABS.map(([id, name]) =>
        `<button data-tab="${id}" class="${state.tab===id?"active":""}">${name}</button>`
      ).join("");
    }

    function setTab(tab, skipHash) {
      state.tab = tab;
      renderTabs();
      render();
      if (!skipHash) writeHash();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function writeHash() {
      let h = "";
      if (state.tab === "teacher" && state.teacher) h = "老師/" + state.teacher;
      else if (state.tab === "klass" && state.klass) h = "班/" + state.klass;
      else if (state.tab === "subject" && state.subject) h = "科/" + state.subject;
      else if (state.tab !== "home") h = state.tab;
      const next = h ? "#" + h : "#";
      if (location.hash !== next && location.hash !== (h ? "#" + h : "")) {
        history.replaceState(null, "", h ? "#" + encodeURI(h) : location.pathname);
      }
    }
    function loadHash() {
      const h = decodeURI(location.hash.replace(/^#/, ""));
      state.teacher = null; state.klass = null; state.subject = null;
      if (!h || h === "home") { state.tab = "home"; return; }
      if (h.startsWith("老師/")) { state.tab = "teacher"; state.teacher = h.slice(3); return; }
      if (h.startsWith("班/")) { state.tab = "klass"; state.klass = h.slice(2); return; }
      if (h.startsWith("科/")) { state.tab = "subject"; state.subject = h.slice(2); return; }
      if (TABS.some(([id]) => id === h)) state.tab = h;
    }

    function goTeacher(code) {
      state.teacher = code;
      state.q = "";
      $("q").value = "";
      setTab("teacher");
    }
    function goClass(cls) {
      state.klass = cls;
      state.q = "";
      $("q").value = "";
      setTab("klass");
    }
    function goSubject(name) {
      state.subject = name;
      state.q = "";
      $("q").value = "";
      setTab("subject");
    }

    function norm(s) {
      return String(s || "").toLowerCase().replace(/\s+/g, "").replace(/[–—-]/g, "");
    }

    function teacherBlob(t) {
      const d = t.duties || {};
      const dutyTxt = ["recess1","recess2","lunch","noon","prep","activities"]
        .flatMap(k => (d[k] || []).map(x => Object.values(x).join(" ")))
        .join(" ");
      return [t.name, t.code, t.homeroom, t.periods, t.liaison,
        (t.chairOf||[]).join(" "), (t.viceOf||[]).join(" "),
        (t.gradeContact||[]).join(" "),
        (t.subjects||[]).map(s => s.subject + " " + s.classes).join(" "),
        Object.values(t.pm || {}).join(" "),
        dutyTxt].join(" ");
    }
    function matchTeacher(t, q) {
      if (!q) return true;
      const nq = norm(q);
      if (t.code && t.code === q) return true;
      if (t.name && t.name.includes(q)) return true;
      return norm(teacherBlob(t)).includes(nq);
    }

    function searchHits(q) {
      const nq = norm(q);
      if (!nq) return { teachers: [], classes: [], subjects: [] };
      const teachers = DATA.teachers.filter(t => matchTeacher(t, q));
      const classes = DATA.classes.filter(c =>
        norm(c.class) === nq ||
        nq === "p" + c.class[0] ||
        ("小" + "一二三四五六"[Number(c.class[0])-1] + c.class[1]).includes(q) ||
        Object.values(c.teachers).some(v => v.includes(q))
      );
      const subjects = [];
      for (const [name, aliases] of Object.entries(DATA.subjectAliases)) {
        if (aliases.some(a => nq === norm(a) || q === a) || name.includes(q)) {
          subjects.push(name);
        }
      }
      return { teachers, classes, subjects };
    }

    function teacherCard(t, compact=false) {
      const subj = t.subjects.map(s =>
        `<dt>${esc(s.subject)}</dt><dd>${esc(s.classes)}${s.star ? '<span class="badge">減 1 節</span>' : ""}</dd>`
      ).join("") || "<dt>科目</dt><dd>—</dd>";
      const pm = Object.entries(t.pm).map(([k,v]) =>
        `<dt>星期${PM_LABEL[k]}</dt><dd>${esc(v) || "—"}</dd>`
      ).join("");
      const roles = [
        t.chairOf.length ? `科主席：${t.chairOf.map(fullSubject).join("、")}` : "",
        t.viceOf.length ? `副科主席：${t.viceOf.map(fullSubject).join("、")}` : "",
        t.liaison ? `級聯絡：${t.liaison}` : "",
        DATA.sen.includes(t.code) ? "SEN" : ""
      ].filter(Boolean);
      const d1 = sortDutyList(t.duties.recess1).map(d =>
        `<div class="duty-item"><b>${esc(d.day)}</b> · ${esc(d.place)}<div class="meta">${esc(d.time)}</div></div>`
      ).join("") || '<div class="meta">沒有小息一當值</div>';
      const d2 = sortDutyList(t.duties.recess2).map(d =>
        `<div class="duty-item"><b>${esc(d.day)}</b> · 晴：${esc(d.sunny)} ／ 雨：${esc(d.rain)}<div class="meta">${esc(d.time)}</div></div>`
      ).join("") || '<div class="meta">沒有小息二當值</div>';
      const lunch = sortDutyList(t.duties.lunch).map(d =>
        `<div class="duty-item"><b>${esc(d.day)}</b> · ${esc(d.class)} 班<div class="meta">${esc(d.time)}</div></div>`
      ).join("") || '<div class="meta">沒有午膳當值</div>';
      const noon = sortDutyList(t.duties.noon).map(d =>
        `<div class="duty-item"><b>${esc(d.day)}</b> · 晴：${esc(d.sunny)} ／ 雨：${esc(d.rain)}<div class="meta">${esc(d.time)}</div></div>`
      ).join("") || '<div class="meta">沒有午息當值</div>';
      const prep = sortDutyList(t.duties.prep).map(d =>
        `<div class="duty-item"><b>${esc(d.day)}</b> · ${esc(d.period)}<div class="meta">${esc(d.text)}</div></div>`
      ).join("") || '<div class="meta">沒有列明備課</div>';
      const act = sortDutyList(t.duties.activities).map(d =>
        `<div class="duty-item"><b>${esc(d.day)}</b><div class="meta">${esc(d.text)}</div></div>`
      ).join("") || '<div class="meta">沒有列明課後活動</div>';

      return `<article class="card" id="t-${esc(t.code)}">
        <div class="name-line">
          <span class="code">${esc(t.code || "—")}</span>
          <h2 style="margin:0">${esc(t.name)}</h2>
          ${t.homeroom ? `<span class="badge teal">${esc(t.homeroom.startsWith("協") ? t.homeroom : t.homeroom + " 班任")}</span>` : ""}
          <span class="badge gold">${esc(t.periods || "—")} 堂</span>
        </div>
        ${roles.length ? `<p class="meta">${roles.map(esc).join(" · ")}</p>` : ""}
        ${compact ? `<p class="meta">${t.subjects.map(s => esc(s.subject)+" "+esc(s.classes)).join(" ／ ") || "無課堂科目"}</p>
          <p><a class="linkish" data-go-teacher="${esc(t.code)}">查看完整資料 →</a></p>` : `
        <div class="row-2">
          <div>
            <h3>課擔</h3>
            <dl class="kv">${subj}</dl>
            <h3>下午（周一至周五）</h3>
            <dl class="kv">${pm}</dl>
          </div>
          <div>
            <h3>小息一 10:05–10:20</h3>${d1}
            <h3>小息二 11:30–11:50</h3>${d2}
            <h3>午膳 13:00–13:40</h3>${lunch}
            <h3>午息 13:40–14:00</h3>${noon}
          </div>
        </div>
        <h3>備課／開會</h3>${prep}
        <h3>課後／下午活動（文件有提及）</h3>${act}
        `}
      </article>`;
    }

    function classCard(c) {
      const rows = Object.entries(c.teachers).map(([k,v]) => {
        const codes = (v || "").split(/[/、＋+]/).map(s => s.trim()).filter(Boolean);
        const people = codes.map(code => {
          const t = teacherByCode(code);
          return t
            ? `<a class="linkish" data-go-teacher="${esc(t.code)}">${esc(code)}</a>`
            : esc(code);
        }).join("／");
        return `<tr><th>${esc(k)}</th><td>${people || "—"}</td></tr>`;
      }).join("");
      const lunch = DATA.lunch.find(x => x.class === c.class);
      const lunchRow = lunch ? WEEKDAYS.map(d => `<td>${teacherLabel(lunch.days[d])}</td>`).join("") : "";
      return `<article class="card">
        <div class="name-line"><h2 style="margin:0">${esc(c.class)}</h2></div>
        <div class="table-wrap"><table>${rows}</table></div>
        ${lunch ? `<h3>午膳當值 13:00–13:40</h3>
          <div class="table-wrap"><table>
            <tr>${WEEKDAYS.map(d=>`<th>${d}</th>`).join("")}</tr>
            <tr>${lunchRow}</tr>
          </table></div>` : ""}
      </article>`;
    }

    function subjectCard(name) {
      const team = DATA.subjectTeams.find(s => s.subject.replace("科","") === name || s.subject === name || s.subject.startsWith(name));
      const role = DATA.subjectRoles.find(s =>
        name.startsWith(s.subject) || s.subject === name.replace("科","") ||
        (name === "資訊科技" && s.subject === "資") ||
        (name === "普通話" && s.subject === "普") ||
        (name === "視藝" && s.subject === "視") ||
        (name === "體育" && s.subject === "體") ||
        (name === "音樂" && s.subject === "音") ||
        (name === "科學" && s.subject === "科學") ||
        (name === "常識" && s.subject === "常") ||
        (name === "人文" && s.subject === "人文") ||
        (name === "數學" && s.subject === "數") ||
        (name === "英文" && s.subject === "英") ||
        (name === "中文" && s.subject === "中")
      );
      const who = DATA.teachers.filter(t => t.subjects.some(s => s.subject === name || s.subject.startsWith(name)));
      const gradeRows = Object.entries(DATA.gradeTeachers).map(([g, map]) => {
        const key = Object.keys(map).find(k => name.startsWith(k) || k.startsWith(name[0]));
        // better key map
        const keymap = {中文:"中",英文:"英",數學:"數",常識:"常",人文:"人文",科學:"科學",音樂:"音",體育:"體",視藝:"視",普通話:"普",資訊科技:"資",生命教育:null};
        const k = keymap[name];
        const val = k ? map[k] : "";
        return `<tr><th>${esc(g)}</th><td>${esc(val || "—")}</td></tr>`;
      }).join("");
      let liaison = "";
      if (role) {
        liaison = Object.entries(role.liaison).map(([g,w]) =>
          `<tr><th>${esc(g)}</th><td>${w ? teacherLabel(w) : "—"}</td></tr>`
        ).join("");
      }
      return `<article class="card">
        <h2>${esc(name)}</h2>
        ${role ? `<p>科主席：${role.chair ? teacherLabel(role.chair) : "—"}
          　副科主席：${role.vice ? teacherLabel(role.vice) : "—"}</p>` : ""}
        ${team ? `<p class="meta">${esc(team.teachers)}（${esc(team.count)}）</p>` : ""}
        <h3>各級科任</h3>
        <div class="table-wrap"><table>${gradeRows}</table></div>
        ${role ? `<h3>級聯絡</h3><div class="table-wrap"><table>${liaison}</table></div>` : ""}
        <h3>相關老師課擔</h3>
        <div class="grid">${who.map(t => teacherCard(t, true)).join("") || "<p>沒有</p>"}</div>
      </article>`;
    }

    function homeView() {
      const hits = state.q ? searchHits(state.q) : null;
      if (hits && (hits.teachers.length || hits.classes.length || hits.subjects.length)) {
        return `<p class="hint">找到 ${hits.teachers.length} 位老師、${hits.classes.length} 班、${hits.subjects.length} 科</p>
          ${hits.subjects.length ? `<h3>科目</h3>` + hits.subjects.map(s => `<button class="chip" data-go-subject="${esc(s)}">${esc(s)}</button>`).join(" ") : ""}
          ${hits.classes.length ? `<h3>班別</h3><div class="grid">${hits.classes.map(classCard).join("")}</div>` : ""}
          ${hits.teachers.length ? `<h3>老師</h3><div class="grid">${hits.teachers.map(t => teacherCard(t, true)).join("")}</div>` : ""}`;
      }
      if (state.q) return `<div class="empty">找不到「${esc(state.q)}」。可試老師代號（如 敏）、全名、班別（1A）或科目（中文）。</div>`;

      return `<div class="welcome">
        <div class="stat">
          <span><b>${DATA.teachers.length}</b>位老師</span>
          <span><b>${DATA.classes.length}</b>班</span>
          <span><b>49</b>節／周</span>
        </div>
        <p class="hint">可使用上方搜尋，或以老師代號、姓名、班別、科目查詢。</p>
        <h3>快速查詢</h3>
        <div class="chips">
          ${["敏","1A","中文","星期二","燕","5A","小息"].map(x => `<button class="chip" data-q="${x}">${x}</button>`).join("")}
        </div>
        <h3>班別</h3>
        <div class="chips">${DATA.classes.map(c => `<button class="chip" data-go-class="${c.class}">${c.class}</button>`).join("")}</div>
        <h3>科目</h3>
        <div class="chips">${Object.keys(DATA.subjectAliases).map(s => `<button class="chip" data-go-subject="${s}">${s}</button>`).join("")}</div>
        <div class="card" style="margin-top:16px">
          <h2>課堂總節數（上午 DAY 循環）</h2>
          <p class="meta">${DATA.periods.notes.map(esc).join(" · ")}</p>
          <div class="table-wrap"><table>
            <tr><th>科目</th>${DATA.periods.grades.map(g=>`<th>${esc(g)}</th>`).join("")}</tr>
            ${DATA.periods.rows.map(r => `<tr><th>${esc(r.subject)}</th>${DATA.periods.grades.map(g=>`<td>${esc(r.byGrade[g]||"—")}</td>`).join("")}</tr>`).join("")}
          </table></div>
        </div>
      </div>`;
    }

    function teacherView() {
      const list = DATA.teachers.filter(t => matchTeacher(t, state.q));
      const focus = state.teacher && !state.q ? DATA.teachers.find(t => t.code === state.teacher) : null;
      const chips = `<div class="chips">${DATA.teachers.map(t =>
        `<button class="tchip ${state.teacher===t.code?"active":""}" data-go-teacher="${esc(t.code)}"><b>${esc(t.code||"·")}</b>${esc(t.name)}</button>`
      ).join("")}</div>`;
      if (focus) return chips + teacherCard(focus);
      return chips + (list.length
        ? (state.q ? `<p class="hint">${list.length} 位老師</p>` : `<p class="hint">揀一位老師，或搜姓名／代號</p>`) +
          (state.q ? list.map(t => teacherCard(t)).join("") : `<div class="grid">${list.map(t => teacherCard(t,true)).join("")}</div>`)
        : `<div class="empty">沒有符合的老師</div>`);
    }

    function classView() {
      const q = state.q;
      let list = DATA.classes;
      if (q) {
        const nq = norm(q);
        list = DATA.classes.filter(c =>
          norm(c.class).includes(nq) || Object.values(c.teachers).join("").includes(q)
        );
      }
      const focus = state.klass && !q ? DATA.classes.find(c => c.class === state.klass) : null;
      const chips = `<div class="chips">${DATA.classes.map(c =>
        `<button class="chip" data-go-class="${c.class}">${c.class}</button>`
      ).join("")}</div>`;
      if (focus) return chips + classCard(focus);
      return chips + list.map(classCard).join("");
    }

    function subjectView() {
      const names = Object.keys(DATA.subjectAliases);
      const chips = `<div class="chips">${names.map(s =>
        `<button class="chip" data-go-subject="${s}">${s}</button>`
      ).join("")}</div>`;
      const focus = state.subject || (state.q && searchHits(state.q).subjects[0]);
      if (focus) return chips + subjectCard(focus);
      return chips + `<p class="hint">揀一科睇科主席、級聯絡同科任。</p>
        <div class="table-wrap"><table>
          <tr><th>科目</th><th>科主席</th><th>副科主席</th><th>科任老師</th></tr>
          ${DATA.subjectRoles.map(r => {
            const team = DATA.subjectTeams.find(s => s.subject.includes(r.subject) || r.subject.includes(s.subject[0]));
            return `<tr><th>${esc(r.subject)}</th><td>${r.chair?teacherLabel(r.chair):"—"}</td><td>${r.vice?teacherLabel(r.vice):"—"}</td><td class="meta">${team?esc(team.teachers):""}</td></tr>`;
          }).join("")}
        </table></div>`;
    }

    function timetableView() {
      const am = DATA.timetable.morning;
      const days = [["mon","一"],["tue","二"],["wed","三"],["thu","四"],["fri","五"]];
      return `<div class="card">
        <h2>全日時間表（學生版）</h2>
        <div class="table-wrap"><table>
          <tr><th>時間</th>${days.map(d=>`<th>星期${d[1]}</th>`).join("")}</tr>
          ${am.map(r => `<tr><th>${esc(r.time)}</th>${days.map(d=>`<td>${esc(r[d[0]])}</td>`).join("")}</tr>`).join("")}
        </table></div>
        <h3>上午課堂（DAY 1–6 循環）</h3>
        <div class="table-wrap"><table>
          <tr><th>節</th><th>時間</th><th>備註</th></tr>
          ${DATA.timetable.lessons.map(r => `<tr><th>${esc(r.period)}</th><td>${esc(r.time)}</td><td>${esc(r.note||"")}</td></tr>`).join("")}
        </table></div>
        <p class="meta">${esc(DATA.timetable.lunch.time)}　${esc(DATA.timetable.lunch.note)}</p>
        <h3>下午 P1–P3</h3>
        <div class="table-wrap"><table>
          <tr><th>時間</th>${days.map(d=>`<th>星期${d[1]}</th>`).join("")}</tr>
          ${DATA.timetable.afternoonP13.map(r => `<tr><th>${esc(r.time)}</th>${days.map(d=>`<td>${esc(r[d[0]])}</td>`).join("")}</tr>`).join("")}
        </table></div>
        <h3>下午 P4–P6</h3>
        <div class="table-wrap"><table>
          <tr><th>時間</th>${days.map(d=>`<th>星期${d[1]}</th>`).join("")}</tr>
          ${DATA.timetable.afternoonP46.map(r => `<tr><th>${esc(r.time)}</th>${days.map(d=>`<td>${esc(r[d[0]])}</td>`).join("")}</tr>`).join("")}
        </table></div>
        <p class="meta">1／2／3 為第一／第二／第三學段。教師版時間表格子原文為空白，供自行填寫。</p>
      </div>`;
    }

    function dutyTable(headers, rows, cellFn) {
      return `<div class="table-wrap"><table>
        <tr>${headers.map(h=>`<th>${esc(h)}</th>`).join("")}</tr>
        ${rows.map(row => `<tr>${cellFn(row)}</tr>`).join("")}
      </table></div>`;
    }

    function highlightCode(text) {
      const t = teacherByCode(text);
      if (t) return teacherLabel(text);
      // Friday noon like 2/F梅
      const m = String(text).match(/^(.+?)([\u4e00-\u9fff]{1,2})$/);
      if (m && teacherByCode(m[2])) return esc(m[1]) + teacherLabel(m[2]);
      return esc(text);
    }

    function dutyView() {
      const q = state.q;
      let extra = "";
      if (q) {
        const tlist = DATA.teachers.filter(t => matchTeacher(t, q));
        if (tlist.length) {
          extra = tlist.map(t => teacherCard(t)).join("");
        }
      }
      return extra + `<div class="card">
        <h2>小息一　10:05–10:20　全校樓層小息（玩具趣趣）</h2>
        <p class="meta">當值老師請準時到達樓層位置 · 第三節老師準時回課室 · ${esc(DATA.dutyIndex.patrol)}</p>
        ${dutyTable(["樓層", ...DAYS6], DATA.recess1, r =>
          `<th>${esc(r.floor)}</th>` + DAYS6.map(d => `<td>${highlightCode(r.days[d])}</td>`).join("")
        )}
      </div>
      <div class="card">
        <h2>小息二　11:30–11:50</h2>
        <p class="meta">晴天：操場活力小息　·　雨天：樓層玩具趣趣</p>
        ${dutyTable(["操場(晴)", "樓層(雨)", ...DAYS6], DATA.recess2, r =>
          `<th>${esc(r.sunny)}</th><th>${esc(r.rain)}</th>` + DAYS6.map(d => `<td>${highlightCode(r.days[d])}</td>`).join("")
        )}
      </div>
      <div class="card">
        <h2>午膳　13:00–13:40</h2>
        ${dutyTable(["班", ...WEEKDAYS], DATA.lunch, r =>
          `<th>${esc(r.class)}</th>` + WEEKDAYS.map(d => `<td>${highlightCode(r.days[d])}</td>`).join("")
        )}
      </div>
      <div class="card">
        <h2>午息　13:40–14:00</h2>
        <p class="meta">一至四：晴天操場繽紛午休／雨天樓層玩具趣趣　·　星期五：全校樓層小息</p>
        ${dutyTable(["操場(晴)", "樓層(雨)", ...WEEKDAYS], DATA.noon, r =>
          `<th>${esc(r.sunny)}</th><th>${esc(r.rain)}</th>` + WEEKDAYS.map(d => `<td>${highlightCode(r.days[d])}</td>`).join("")
        )}
      </div>`;
    }

    function pmView() {
      const days = WEEKDAYS.slice(0,4);
      return `<div class="card">
        <h2>周一至周四下午安排</h2>
        <p class="meta">SEN：${DATA.sen.map(teacherLabel).join("／")}</p>
        ${dutyTable(days, DATA.afternoonActivities, r =>
          days.map(d => `<td>${esc(r[d] || "")}</td>`).join("")
        )}
      </div>`;
    }

    function prepView() {
      return `<div class="card">
        <h2>各級備課及開會時間</h2>
        ${dutyTable(["節", ...DAYS6], DATA.prep, r =>
          `<th>${esc(r.period)}</th>` + DAYS6.map(d => `<td>${esc(r.days[d] || "")}</td>`).join("")
        )}
        <ul>${DATA.timetable.prepExtra.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
      </div>`;
    }

    function rulesView() {
      const s = DATA.signIn;
      const d = DATA.dutyIndex;
      return `<div class="row-2">
        <article class="card">
          <h2>簽到及離校</h2>
          <dl class="kv">
            <dt>簽到</dt><dd>${esc(s.duty)}<br>${esc(s.others)}</dd>
            <dt>外出午膳</dt><dd>${esc(s.lunchOutDuty)}<br>${esc(s.lunchOutFree)}</dd>
            <dt>簽走</dt><dd>${esc(s.leaveNoMeeting)}<br>${esc(s.leaveActivity)}<br>${esc(s.lateStay)}</dd>
            <dt>備註</dt><dd>${esc(s.adminMeeting)}</dd>
          </dl>
        </article>
        <article class="card">
          <h2>當值指數</h2>
          <ul>
            <li>${esc(d.tutorial)}</li>
            <li>${esc(d.lunchHomeroom)}</li>
            <li>${esc(d.lunchOthers)}</li>
            <li>${esc(d.lunchVP)}</li>
            <li>${esc(d.recess)}</li>
            <li>${esc(d.library)}</li>
            <li>${esc(d.morning)}</li>
          </ul>
        </article>
      </div>
      <article class="card">
        <h2>課擔備註</h2>
        <ul>${DATA.loadNotes.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
      </article>`;
    }

    function render() {
      renderTabs();
      const view = {
        home: homeView,
        teacher: teacherView,
        klass: classView,
        subject: subjectView,
        timetable: timetableView,
        duty: dutyView,
        pm: pmView,
        prep: prepView,
        rules: rulesView
      }[state.tab];
      $("main").innerHTML = view();
    }

    document.addEventListener("click", (e) => {
      const tab = e.target.closest("[data-tab]");
      if (tab) { state.teacher = null; state.klass = null; state.subject = null; setTab(tab.dataset.tab); return; }
      const gt = e.target.closest("[data-go-teacher]");
      if (gt) { goTeacher(gt.dataset.goTeacher); return; }
      const gc = e.target.closest("[data-go-class]");
      if (gc) { goClass(gc.dataset.goClass); return; }
      const gs = e.target.closest("[data-go-subject]");
      if (gs) { goSubject(gs.dataset.goSubject); return; }
      const qq = e.target.closest("[data-q]");
      if (qq) {
        $("q").value = qq.dataset.q;
        state.q = qq.dataset.q;
        state.tab = "home";
        render();
      }
    });

    $("q").addEventListener("input", (e) => {
      state.q = e.target.value.trim();
      if (state.tab === "home" || state.q) {
        if (state.tab !== "home" && state.q) {
          /* keep current tab but filter */
        }
        render();
      }
    });
    $("q").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const hits = searchHits(state.q);
        if (hits.teachers.length === 1 && !hits.classes.length) goTeacher(hits.teachers[0].code);
        else if (hits.classes.length === 1 && hits.teachers.length === 0) goClass(hits.classes[0].class);
        else { state.tab = "home"; writeHash(); render(); }
      }
    });

    window.addEventListener("hashchange", () => { loadHash(); render(); });
    loadHash();
    const prefill = new URLSearchParams(location.search).get("q");
    if (prefill) {
      state.q = prefill;
      $("q").value = prefill;
      state.tab = "home";
    }
    render();
  </script>
</body>
</html>
